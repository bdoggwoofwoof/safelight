<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Safelight</title>
<meta name="description" content="Photo editor for a consistent Instagram feed: your exact colors, every photo.">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safelight">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/vendor/jszip.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen darkroom app — photo stage on top, film strip, tool tabs and panel below; side-by-side on wide screens.
   Neutral greys on purpose so the UI never tints how you judge color; one safelight-amber accent. */
:root{
  --bg:#121212; --surface:#1b1b1b; --raised:#242424; --line:#303030;
  --fg:#ecebe8; --muted:#8d8c88; --accent:#f2a04e; --accent-ink:#1a1206; --danger:#e5674f;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{height:100%;margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto 250px;gap:10px;padding-block:10px;max-width:1400px;margin:0 auto}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr) auto;column-gap:20px}
  header{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2}
  .strip{grid-column:1;grid-row:3}
  .tools{grid-column:2;grid-row:2/4;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
}
.tools{display:contents}
@media (min-width:900px){.tools{display:grid}}

header{display:flex;align-items:center;gap:8px}
@media (max-width:480px){.wide{display:none}header .btn{padding:7px 11px}.seg button{padding:6px 10px}.brand{font-size:18px}}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:6px 10px;font-size:13px}

.stage{position:relative;min-height:0;border-radius:12px;background:#0c0c0c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas.main{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto}
.badge{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:6px}
.hint{position:absolute;right:10px;bottom:10px;font-size:12px;color:#cfcfcf;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px}
.feed{position:absolute;inset:0;overflow:auto;padding:10px;background:var(--bg);touch-action:pan-y}
.feed-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.feed-inner button{border:0;padding:0;background:#000;aspect-ratio:3/4;overflow:hidden;display:block;max-width:100%}
.feed-inner canvas{width:100%;height:100%;object-fit:cover;display:block}
.feed-note{max-width:520px;margin:0 auto 10px;color:var(--muted);font-size:13px;line-height:1.45}

.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.thumb{position:relative;flex:0 0 auto;width:56px;height:70px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:#000}
.thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:20px;text-align:center}
.thumb.add{border:1px dashed var(--line);background:var(--surface);color:var(--muted);font-size:24px;display:grid;place-items:center}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 10px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.panel{overflow-y:auto;min-height:0;padding:12px 2px 24px}
.sec{display:grid;gap:12px;margin-bottom:22px}
.sec h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:0;max-width:60ch}
.note b{color:var(--fg);font-weight:600}

.srow{display:grid;gap:4px}
.shead{display:flex;justify-content:space-between;align-items:baseline}
.shead label{font-weight:500}
.val{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.val.on{color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--track,var(--line))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track,var(--line))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--fg);margin-top:-8px;border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:3px solid var(--bg)}
input[type=range]:disabled{opacity:.35}

.presets{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.preset{flex:0 0 auto;width:78px;border:0;background:none;padding:0;text-align:left;display:grid;gap:4px}
.preset canvas{width:78px;height:98px;object-fit:cover;border-radius:8px;border:2px solid transparent;display:block;background:#000}
.preset[aria-pressed="true"] canvas{border-color:var(--accent)}
.preset .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.preset .nm{font-size:13px;font-weight:600;line-height:1.1}
.preset[aria-pressed="true"] .code{color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ref{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ref img{width:52px;height:65px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.ref div{min-width:0;flex:1}
.ref strong{display:block}
.check{display:flex;align-items:center;gap:8px}
.check input{accent-color:var(--accent);width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{flex:1 1 0;min-width:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.recipe{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.recipe .meta{flex:1;min-width:0}
.recipe .meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recipe .meta span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;align-items:end;justify-items:center;z-index:20;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-wrap{align-items:center}}
.sheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;max-height:90%;overflow:auto}
.sheet h2{margin:0;font-family:var(--f-display);font-size:20px}
.sheet .stack{display:grid;gap:8px}
.sheet .stack .btn{justify-content:center;padding:12px}
.sheet img.fallback{width:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}
.tapbar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:8px 8px 8px 14px;border-radius:10px;font-weight:600;z-index:3}
.tapbar span{flex:1;min-width:0}
.tapbar button{border:0;background:rgba(0,0,0,.18);color:inherit;padding:6px 12px;border-radius:8px;font-weight:600}
.stage.tapping canvas.main{cursor:crosshair}
.markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(0,0,0,.6)}
.ccard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.ccard.off{opacity:.55}
.chead{display:flex;gap:8px;align-items:center}
.chead input[type=color]{width:42px;height:42px;border:0;padding:0;background:none;flex:0 0 auto;cursor:pointer}
.chead input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.chead input[type=color]::-webkit-color-swatch{border:1px solid rgba(255,255,255,.18);border-radius:9px}
.chead input[type=color]::-moz-color-swatch{border:1px solid rgba(255,255,255,.18);border-radius:9px}
.field.hex{flex:0 0 92px;font-family:var(--f-mono);font-size:13px;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.18);flex:0 0 auto}
.sw.empty{background:repeating-linear-gradient(45deg,#2a2a2a 0 4px,#1f1f1f 4px 8px)}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.ok{color:#9bd38a;border-color:#3d5a35}
.pill.warn{color:var(--accent);border-color:#6a4a26}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;list-style:none}
details.more summary::before{content:"+ ";}
details.more[open] summary::before{content:"\2212  ";}
details.more[open]{display:grid;gap:12px}
.stage canvas.ov{pointer-events:none}
.stage.painting{cursor:crosshair}
.toolseg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.toolseg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;color:var(--muted);font-weight:600}
.toolseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tstep{flex:0 0 auto;border:0;background:none;padding:0;display:grid;gap:3px;justify-items:center;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.tstep canvas{width:46px;height:58px;object-fit:cover;border-radius:6px;border:2px solid transparent;display:block;background:#000}
.tstep[aria-current="true"]{color:var(--accent)}
.tstep[aria-current="true"] canvas{border-color:var(--accent)}
select.field{appearance:auto}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.55;display:grid;gap:2px}
.steps b{color:var(--fg)}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><i aria-hidden="true"></i>Safelight</div>
    <div class="seg" role="group" aria-label="View">
      <button id="vEdit" aria-pressed="true">Edit</button>
      <button id="vFeed" aria-pressed="false">Feed</button>
    </div>
    <label class="btn" for="fileIn">Add<span class="wide">&nbsp;photos</span></label>
    <input id="fileIn" type="file" accept="image/*" multiple hidden>
    <button class="btn primary" id="saveBtn">Save</button>
  </header>

  <div class="stage" id="stage">
    <canvas class="main" id="main" width="1080" height="1350" aria-label="Photo preview"></canvas>
    <canvas class="main ov" id="ov" width="1080" height="1350" hidden></canvas>
    <span class="badge" id="badge" hidden>Original</span>
    <span class="hint" id="hint">Hold to see original</span>
    <div class="markers" id="markers"></div>
    <div class="tapbar" id="tapbar" hidden><span id="tapText"></span><button id="tapCancel">Cancel</button></div>
    <div class="feed" id="feed" hidden>
      <p class="feed-note">Your grid with the current recipe. Keep adjusting below and every tile updates.</p>
      <div class="feed-inner" id="feedGrid"></div>
    </div>
  </div>

  <div class="strip" id="strip" aria-label="Photos"></div>

  <div class="tools">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
}
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ss = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const signed = v => (v > 0 ? "+" : "") + v;
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const PI2 = Math.PI * 2;
const wrap = d => d > Math.PI ? d - PI2 : d < -Math.PI ? d + PI2 : d;
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- color science (OKLab, so hue and lightness move independently) ---------- */
const TO_LIN = new Float32Array(4096), GN = 16383, TO_GAM = new Float32Array(GN + 1);
for (let i = 0; i < 4096; i++) TO_LIN[i] = Math.pow(i / 4095, 2.2);
for (let i = 0; i <= GN; i++) TO_GAM[i] = Math.pow(i / GN, 1 / 2.2);
const LAB = new Float32Array(3), RGB = new Float32Array(3);
function rgb2lab(r, g, b) {
  r = TO_LIN[r <= 0 ? 0 : r >= 1 ? 4095 : (r * 4095) | 0];
  g = TO_LIN[g <= 0 ? 0 : g >= 1 ? 4095 : (g * 4095) | 0];
  b = TO_LIN[b <= 0 ? 0 : b >= 1 ? 4095 : (b * 4095) | 0];
  const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b);
  const m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b);
  const s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
  LAB[0] = .2104542553 * l + .7936177850 * m - .0040720468 * s;
  LAB[1] = 1.9779984951 * l - 2.4285922050 * m + .4505937099 * s;
  LAB[2] = .0259040371 * l + .7827717662 * m - .8086757660 * s;
}
function lab2rgb(L, A, B) {
  let l = L + .3963377774 * A + .2158037573 * B, m = L - .1055613458 * A - .0638541728 * B, s = L - .0894841775 * A - 1.2914855480 * B;
  l = l * l * l; m = m * m * m; s = s * s * s;
  const r = 4.0767416621 * l - 3.3077115913 * m + .2309699292 * s;
  const g = -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s;
  const b = -.0041960863 * l - .7034186147 * m + 1.7076147010 * s;
  RGB[0] = TO_GAM[r <= 0 ? 0 : r >= 1 ? GN : (r * GN) | 0];
  RGB[1] = TO_GAM[g <= 0 ? 0 : g >= 1 ? GN : (g * GN) | 0];

const LABCACHE = {};
function hexLab(hex) {
  if (LABCACHE[hex]) return LABCACHE[hex];
  const n = parseInt(hex.slice(1), 16);
  rgb2lab(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
  const L = LAB[0], A = LAB[1], B = LAB[2];
  return LABCACHE[hex] = { L, A, B, C: Math.hypot(A, B), h: Math.atan2(B, A) };
}
const toHex = (r, g, b) => "#" + [r, g, b].map(v => Math.round(clamp01(v) * 255).toString(16).padStart(2, "0")).join("");
function labHex(L, A, B) { lab2rgb(L, A, B); return toHex(RGB[0], RGB[1], RGB[2]); }

/* ---------- looks ---------- */
const ZERO = { exposure:0, contrast:0, highlights:0, shadows:0, fade:0, temp:0, tint:0, saturation:0, vibrance:0, shAmt:0, shHue:30, hiAmt:0, hiHue:45, grain:0, vignette:0,
  skinTone:0, skinSat:0, skinBright:0, skinProtect:0 };
// How skin-like a color is (OKLab): warm hues around 57°, moderate saturation, not too dark.
function skinWeight(L, a, b) {
  const C = Math.sqrt(a * a + b * b); if (C < .02 || L < .14) return 0;
  const z = wrap(Math.atan2(b, a) - 1.0) / .3; if (z > 2.5 || z < -2.5) return 0;
  return Math.exp(-z * z) * ss(.02, .045, C) * (1 - ss(.15, .21, C)) * ss(.14, .26, L) * (1 - ss(.93, .99, L));
}
const PRESETS = [
  { id:"none",  code:"N0", name:"Natural", p:{} },
  { id:"peri",  code:"B1", name:"Periwinkle", p:{ contrast:5, highlights:-15, shadows:10, fade:18, temp:-6, saturation:-22, vibrance:-5, shAmt:10, shHue:220, grain:18, skinProtect:30 } },
  { id:"linen", code:"L1", name:"Linen",  p:{ exposure:12, contrast:-15, highlights:-20, shadows:25, fade:25, temp:5, saturation:-10, vibrance:10, hiAmt:15, hiHue:45 } },
  { id:"honey", code:"H2", name:"Honey",  p:{ exposure:5, contrast:10, temp:28, tint:5, saturation:5, shAmt:15, shHue:30, hiAmt:20, hiHue:45, fade:10, grain:15 } },
  { id:"fern",  code:"F3", name:"Fern",   p:{ contrast:15, highlights:-25, shadows:10, temp:-5, tint:-10, saturation:-20, shAmt:25, shHue:170, fade:15, grain:10 } },

  return { preset: "none", strength: 100, adj, match, palette };
}
const tRecipe = step => blendRecipe(transition.from, transition.to, transition.steps ? step / transition.steps : 1);
function applyStep() {
  state.recipe = JSON.parse(JSON.stringify(tRecipe(transition.step)));
  persist(); scheduleRender(); schedulePresetThumbs(); renderPanel();
}
function withRecipe(rec, fn) { const keep = state.recipe; state.recipe = rec; try { return fn(); } finally { state.recipe = keep; } }
function renderTransitionPreviews(strip) {
  const p = curPhoto(); if (!p?.mini || !transition) return;
  for (let s = 0; s <= transition.steps; s++) {
    const c = strip.children[s]?.querySelector("canvas"); if (!c) continue;
    withRecipe(tRecipe(s), () => {
      const A = analyze(p), out = new ImageData(p.mini.width, p.mini.height);
      processImage(p.mini, out, A.P, { ...A.opts, fx: false });
      c.width = out.width; c.height = out.height; c.getContext("2d").putImageData(out, 0, 0);
    });
  }
  analyze(p);
}
function transitionSection() {
  const sec = h("div", { class: "sec" }, h("h3", { text: "Ease back to natural" }));
  if (!transition) {
    sec.append(h("p", { class: "note", text: "Step your next posts from your current edit back to a natural look a little at a time, so the grid changes gradually instead of all at once." }));
    const opts = state.recipes.map(rc => h("option", { value: rc.id, text: rc.name }));
    const from = h("select", { class: "field", id: "t-from" }, h("option", { value: "current", text: "My current look" }), opts);
    const to = h("select", { class: "field", id: "t-to" }, h("option", { value: "natural", text: "Natural (built in)" }), state.recipes.map(rc => h("option", { value: rc.id, text: rc.name })));
    let steps = 6; const chips = h("div", { class: "chips" });
    const paint = () => chips.replaceChildren(...[3, 6, 9, 12].map(n => h("button", { class: "chip", "aria-pressed": n === steps ? "true" : "false", text: n + " posts", onclick: () => { steps = n; paint(); } })));
    paint();
    sec.append(h("label", { class: "note", for: "t-from", text: "From" }), from, h("label", { class: "note", for: "t-to", text: "To" }), to,
      h("p", { class: "note", text: "Over the next" }), chips,
      h("div", { class: "row" }, h("button", { class: "btn primary small", text: "Start the transition", onclick: () => {
        const pick = v => v === "current" ? JSON.parse(JSON.stringify(state.recipe)) : v === "natural" ? NATURAL_END() : JSON.parse(JSON.stringify(state.recipes.find(r => r.id === v)?.recipe || state.recipe));
        transition = { from: pick(from.value), to: pick(to.value), steps, step: 1, fromName: from.selectedOptions[0].text, toName: to.selectedOptions[0].text };
        saveTransition(); applyStep(); toast("Post 1 of " + steps + " is ready to edit");
      } })));
    return sec;
  }
  const T = transition, strip = h("div", { class: "tstrip" });
  for (let s = 0; s <= T.steps; s++)
    strip.append(h("button", { class: "tstep", "aria-current": s === T.step ? "true" : "false", "aria-label": s === 0 ? "Where you started" : "Post " + s,
      onclick: () => { T.step = s; saveTransition(); applyStep(); } }, h("canvas"), h("span", { text: s === 0 ? "Now" : String(s) })));
  sec.append(
    h("p", { class: "note" }, h("b", { text: T.step === 0 ? "Your starting look" : "Post " + T.step + " of " + T.steps }), " · " + T.fromName + " → " + T.toName),
    strip,
    h("div", { class: "row" },
      h("button", { class: "btn small", text: "Previous", disabled: T.step <= 0, onclick: () => { T.step--; saveTransition(); applyStep(); } }),
      h("button", { class: "btn primary small", text: T.step >= T.steps ? "Finished" : "Next post", disabled: T.step >= T.steps, onclick: () => { T.step++; saveTransition(); applyStep(); toast("Post " + T.step + " of " + T.steps); } }),
      h("button", { class: "btn ghost small", text: "Reset this step", onclick: applyStep }),
      h("button", { class: "btn ghost small", text: "End transition", onclick: () => { transition = null; saveTransition(); renderPanel(); toast("Transition ended. Your current look stays."); } })),
    h("p", { class: "note", text: "One step per post: edit and save it, then tap Next post. Painting and the blue fade a little each step, and you can still tweak any photo." }));
  requestAnimationFrame(() => renderTransitionPreviews(strip));
  return sec;
}

/* ---------- recipes store ---------- */
const Store = {
  mode: "local", col: null,
  async init() {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.col = db.collection("data/users/" + id); this.mode = "cloud";
    } catch (e) {}
  },
  local() { return LS.get("safelight:recipes", []); },
  async list() {
    if (this.col) {
      try {
        const snap = await this.col.get();
        const cloud = snap.docs.filter(d => d.exists && d.data().kind === "recipe").map(d => ({ id: d.id, ...d.data() }));
        const ids = new Set(cloud.map(c => c.id));
        for (const l of this.local()) if (!ids.has(l.id)) { cloud.push(l); this.col.doc(l.id).set(l).catch(() => {}); }
        return cloud.sort((a, b) => b.createdAt - a.createdAt);
      } catch (e) {}
    }
    return this.local().sort((a, b) => b.createdAt - a.createdAt);
  },
  async save(rc) { LS.set("safelight:recipes", [rc, ...this.local().filter(x => x.id !== rc.id)]); if (this.col) await this.col.doc(rc.id).set(rc); },
  async remove(id) { LS.set("safelight:recipes", this.local().filter(x => x.id !== id)); if (this.col) await this.col.doc(id).delete(); },
};
async function saveRecipe(name) {
  name = (name || "").trim() || "Recipe " + (state.recipes.length + 1);
  const rc = { kind: "recipe", id: uid(), name, recipe: JSON.parse(JSON.stringify(state.recipe)), crop: state.crop, createdAt: Date.now() };
  state.recipes.unshift(rc); renderPanel();
  try { await Store.save(rc); toast("Saved " + name); }
  catch (e) { toast(e?.code === "quota_exceeded" ? "Storage is full. Delete an old recipe and try again." : "Saved in this browser only."); }
}
async function deleteRecipe(id) {
  state.recipes = state.recipes.filter(x => x.id !== id); renderPanel();
  try { await Store.remove(id); } catch (e) {}
  toast("Recipe deleted");
}
function applyRecipe(rc) {
  state.recipe = JSON.parse(JSON.stringify(rc.recipe));
  state.recipe.adj = { ...ZERO, ...state.recipe.adj };
  if (!Array.isArray(state.recipe.palette)) state.recipe.palette = [];
  upgradePalette(state.recipe.palette);
  const cropChanged = rc.crop && rc.crop !== state.crop; if (rc.crop) state.crop = rc.crop;
  persist(); toast("Applied " + rc.name);
  if (cropChanged) rebuildAll(); else { scheduleRender(); schedulePresetThumbs(); renderPanel(); }
}

/* ---------- export ---------- */
async function renderExport(photo) {
  const src = await decode(photo), [W, H] = dims(src), rect = cropRect(W, H, state.crop);
  const scale = state.size === "ig" ? Math.min(1, 1080 / rect.w) : Math.min(1, Math.sqrt(16e6 / (rect.w * rect.h)));
  const d = drawTo(src, rect, scale);
  if (!photo.sample && src.close) src.close();
  const A = analyze(photo);
  processImage(d.data, d.data, A.P, { ...A.opts, fx: true, grainScale: Math.max(1, Math.max(d.data.width, d.data.height) / 1100) });
  d.ctx.putImageData(d.data, 0, 0);
  return await new Promise(res => d.canvas.toBlob(res, "image/jpeg", .92));
}
const outName = p => "safelight-" + p.name.replace(/\.[^.]+$/, "").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".jpg";
const canShareFiles = files => { try { return !!(navigator.canShare && navigator.canShare({ files })); } catch (e) { return false; } };
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob), a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function openSheet(kids) { const s = $("#sheet"); s.replaceChildren(h("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, kids)); s.hidden = false; }
function closeSheet() { $("#sheet").hidden = true; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); setTapMode(null); } });

// Rendering takes a moment, and phones only open the share sheet straight from a tap,
// so saving is two taps: prepare, then save.
function openSaveSheet() {
  const n = state.photos.length, status = h("p", { class: "note", "aria-live": "polite" });
  const sizeSeg = h("div", { class: "chips" });
  const paintSize = () => { sizeSeg.replaceChildren(...[["ig", "Instagram size (1080 wide)"], ["full", "Full size"]].map(([id, l]) =>
    h("button", { class: "chip", "aria-pressed": state.size === id ? "true" : "false", text: l, onclick: () => { state.size = id; paintSize(); reset(); } }))); };
  paintSize();
  let ready = null;
  const go = h("div", { class: "stack" });
  const prep = async which => {
    const list = which === "one" ? [curPhoto()] : state.photos.slice();
    go.querySelectorAll("button").forEach(b => b.disabled = true);
    const files = [], used = new Set();
    for (let i = 0; i < list.length; i++) {
      status.textContent = list.length > 1 ? `Rendering ${i + 1} of ${list.length}…` : "Rendering…";
      let nm = outName(list[i]); while (used.has(nm)) nm = nm.replace(/\.jpg$/, "-" + i + ".jpg"); used.add(nm);
      files.push(new File([await renderExport(list[i])], nm, { type: "image/jpeg" }));
    }
    ready = files; status.textContent = ""; paintGo();
  };
  const save = async () => {
    const files = ready;
    if (canShareFiles(files)) {
      try { await navigator.share({ files }); status.textContent = "Done."; }
      catch (e) { status.textContent = e?.name === "AbortError" ? "Save cancelled." : "That didn't go through. Tap Save again."; }
      return;
    }
    if (files.length > 3 && window.JSZip) {
      status.textContent = "Packing a .zip…";
      const z = new JSZip(); files.forEach(f => z.file(f.name, f));
      downloadBlob("safelight-photos.zip", await z.generateAsync({ type: "blob" }));
    } else files.forEach(f => downloadBlob(f.name, f));
    status.textContent = "Downloaded.";
  };
  const reset = () => { ready = null; paintGo(); };
  function paintGo() {
    if (ready) {
      const lbl = ready.length > 1 ? `Save ${ready.length} photos` : "Save photo";
      go.replaceChildren(h("button", { class: "btn primary", text: lbl, onclick: save }),
        h("p", { class: "note", text: canShareFiles(ready) ? "On iPhone, choose Save Image (or Save " + ready.length + " Images) to put them in Photos." : "They'll go to your downloads." }),
        h("button", { class: "btn ghost", text: "Start over", onclick: reset }));
    } else {
      go.replaceChildren(h("button", { class: "btn primary", text: "Prepare this photo", onclick: () => prep("one") }),
        n > 1 && h("button", { class: "btn", text: `Prepare all ${n} photos`, onclick: () => prep("all") }));
    }
  }
  paintGo();
  openSheet([h("h2", { text: "Save photos" }),
    h("div", { class: "stack" }, h("h3", { class: "note", text: "Size" }), sizeSeg),
    go, status, h("button", { class: "btn ghost", text: "Close", onclick: closeSheet })]);
}
$("#saveBtn").onclick = openSaveSheet;

async function backupRecipes() {
  const blob = new Blob([JSON.stringify({ app: "safelight", version: 1, recipes: state.recipes, transition }, null, 1)], { type: "application/json" });
  const file = new File([blob], "safelight-recipes.json", { type: "application/json" });
  if (canShareFiles([file])) { try { await navigator.share({ files: [file] }); } catch (e) {} return; }
  downloadBlob(file.name, file);
}
async function restoreRecipes(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.recipes)) throw 0;
    let added = 0;
    for (const rc of data.recipes) {
      if (!rc?.recipe || state.recipes.some(x => x.id === rc.id)) continue;
      await Store.save(rc); state.recipes.push(rc); added++;
    }
    state.recipes.sort((a, b) => b.createdAt - a.createdAt);
    renderPanel(); toast(added ? `Restored ${added} recipe${added > 1 ? "s" : ""}` : "Those recipes are already here");
  } catch (e) { toast("That file isn't a Safelight backup."); }
}

/* ---------- add photos ---------- */
$("#fileIn").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = ""; if (!files.length) return;
  if (state.photos.every(p => p.isSample)) state.photos = [];
  const start = state.photos.length; let failed = 0;
  toast(`Opening ${files.length} photo${files.length > 1 ? "s" : ""}…`);
  for (const f of files) {
    const p = { id: uid(), name: f.name, file: f };
    try { await buildBase(p); state.photos.push(p); state.cur = state.photos.length - 1; renderStrip(); renderMain(); }
    catch (err) { failed++; }
  }
  if (!state.photos.length) await loadSamples();
  state.cur = Math.min(start, state.photos.length - 1);
  renderAll();
  if (failed) toast(`${failed} file${failed > 1 ? "s" : ""} couldn't be opened. Try JPEG, PNG or HEIC.`);
});

/* ---------- boot ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
(async function boot() {
  renderTabs();
  await loadSamples();
  renderAll();
  state.recipes = await Store.list();
  if (state.tab === "recipes") renderPanel();
  await Store.init();
  if (Store.mode === "cloud") {
    state.recipes = await Store.list();
    try {
      const d = await Store.col.doc("transition").get();
      if (d.exists) { const v = d.data(); transition = v.off ? null : { from: v.from, to: v.to, steps: v.steps, step: v.step, fromName: v.fromName, toName: v.toName }; LS.set("safelight:transition", transition); }
      else if (transition) saveTransition();
    } catch (e) {}
    if (state.tab === "recipes") renderPanel();
  }
})();
</script>
